<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>TIPSY PARTY · 테이블</title>
<meta name="description" content="TIPSY PARTY — 쉼·삶·애. 마음이 가까워지는 대화 게임 테이블.">
<meta name="theme-color" content="#17131b">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🥂</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hahmlet:wght@300;500;700&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
  :root{--ink:#f4efe9;--ink-dim:#a79da8;--accent:#D9A648;--accent-soft:rgba(217,166,72,.12);--glow:rgba(217,166,72,.30);--card:rgba(255,255,255,.055);--card-bd:rgba(255,255,255,.12)}
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{font-family:'Gowun Dodum',sans-serif;color:var(--ink);overflow:hidden;
    background:#17131b;
    background:radial-gradient(130% 110% at 50% -10%, #262030 0%, #1b1622 45%, #120f17 80%, #0c0a10 100%)}
  .serif{font-family:'Hahmlet',serif}
  .stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:26px}
  .glow{position:fixed;inset:0;pointer-events:none;z-index:0;
    background:radial-gradient(120% 90% at 50% -10%,var(--glow),transparent 55%),radial-gradient(100% 70% at 50% 120%,var(--accent-soft),transparent 60%);opacity:0;transition:opacity .9s ease}
  .glow.on{opacity:.55}
  .petal{position:fixed;z-index:1;pointer-events:none;font-size:20px;opacity:.32;filter:blur(.3px);animation:drift linear infinite}
  @keyframes drift{0%{transform:translate(0,106vh) rotate(0deg)}100%{transform:translate(6vw,-8vh) rotate(40deg)}}

  .screen{position:relative;z-index:2;width:100%;max-width:800px;text-align:center;display:none}
  .screen.show{display:block}
  .brand{letter-spacing:.55em;font-size:13px;color:var(--ink-dim);margin-bottom:14px;padding-left:.55em}
  .screen h1{font-weight:300;font-size:clamp(25px,5vw,38px);line-height:1.45;margin-bottom:8px}
  .screen h1 b{font-weight:700}
  .sub{color:var(--ink-dim);font-size:14px;margin-bottom:32px}
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:14px}
  .pick{position:relative;border:1px solid var(--card-bd);background:var(--card);backdrop-filter:blur(6px);
    border-radius:20px;padding:26px 12px 22px;cursor:pointer;transition:transform .25s,border-color .25s,box-shadow .25s;overflow:hidden;
    box-shadow:0 12px 32px -18px rgba(0,0,0,.65)}
  .pick:active{transform:scale(.96)}
  .pick:hover{transform:translateY(-4px);border-color:var(--pk);box-shadow:0 16px 40px -16px var(--pk)}
  .pick .dot{width:34px;height:34px;border-radius:50%;margin:0 auto 12px;background:var(--pk);box-shadow:0 0 20px -2px var(--pk)}
  .pick .nm{font-family:'Hahmlet',serif;font-size:20px;font-weight:500}
  .pick .cc{font-size:11.5px;color:var(--ink-dim);margin-top:5px;line-height:1.5}
  .pick .md{font-size:10.5px;color:var(--pk);margin-top:9px;font-weight:600}

  #table{position:relative;z-index:2;width:100%;max-width:720px;display:none;flex-direction:column;align-items:center;text-align:center}
  #table.show{display:flex}
  .topbar{position:fixed;top:0;left:0;right:0;z-index:5;display:flex;justify-content:space-between;align-items:center;padding:16px 20px}
  .back{font-size:13px;color:var(--ink-dim);background:none;border:none;font-family:inherit;cursor:pointer;letter-spacing:.05em}
  .back:active{opacity:.6}
  .rounds{display:flex;gap:5px;background:rgba(255,255,255,.07);border:1px solid var(--card-bd);border-radius:30px;padding:4px}
  .rd{border:none;background:none;color:var(--ink-dim);font-family:inherit;font-size:11.5px;padding:5px 12px;border-radius:30px;cursor:pointer;transition:.2s}
  .rd.active{background:var(--accent);color:#141018;font-weight:bold}

  .theme-head{margin-bottom:14px}
  .theme-kw{font-size:12px;letter-spacing:.5em;color:var(--accent);padding-left:.5em;margin-bottom:8px}
  .theme-name{font-family:'Hahmlet',serif;font-weight:700;font-size:clamp(28px,6.5vw,44px);line-height:1.08}
  .rule{display:inline-flex;align-items:center;gap:7px;margin-top:15px;font-size:12.5px;color:var(--ink);
    background:rgba(255,255,255,.06);border:1px solid var(--glow);padding:9px 16px;border-radius:30px;max-width:90vw}
  .rule b{color:var(--accent);font-weight:normal}

  .qcard{width:100%;min-height:232px;display:flex;align-items:center;justify-content:center;border-radius:24px;padding:40px 28px;margin:18px 0 22px;
    background:var(--card);backdrop-filter:blur(8px);border:1px solid var(--card-bd);
    box-shadow:0 26px 60px -34px var(--glow),inset 0 1px 0 rgba(255,255,255,.07);position:relative}
  .qmark{position:absolute;top:12px;left:22px;font-family:'Hahmlet',serif;font-size:50px;color:var(--accent);opacity:.22;line-height:1}
  .qcard.start .qmark{display:none}
  #qbody{width:100%;transition:opacity .4s ease,transform .4s ease}
  #qbody.fade{opacity:0;transform:translateY(14px)}

  .taste{display:flex;flex-direction:column;gap:16px;align-items:center}
  .taste-stmt{font-family:'Hahmlet',serif;font-weight:500;font-size:clamp(21px,4.5vw,30px);line-height:1.5}
  .taste-hint{font-size:13px;color:var(--ink-dim)}

  .rwrap{display:flex;flex-direction:column;gap:13px;align-items:center;animation:pop .5s ease}
  .r-num{font-family:'Hahmlet',serif;font-weight:700;font-size:clamp(36px,8vw,56px);color:var(--accent);letter-spacing:.06em;line-height:1;text-shadow:0 0 28px var(--glow)}
  .r-sub{font-family:'Hahmlet',serif;font-weight:300;font-size:clamp(19px,4.2vw,27px);line-height:1.4}
  .r-hint{font-size:12.5px;color:var(--ink-dim)}

  .tcwrap{display:flex;flex-direction:column;gap:16px;align-items:center;animation:pop .5s ease}
  .tc-label{font-size:12.5px;letter-spacing:.14em;font-weight:600;color:var(--accent);
    background:linear-gradient(120deg,rgba(255,255,255,.08),var(--accent-soft));border:1px solid var(--glow);
    padding:7px 16px;border-radius:30px;box-shadow:0 4px 14px -6px var(--glow)}
  .tc-nums{display:flex;gap:clamp(10px,3vw,22px);justify-content:center;align-items:center}
  .tc-num{font-family:'Hahmlet',serif;font-weight:700;font-size:clamp(30px,7vw,50px);color:var(--accent);line-height:1;letter-spacing:.02em;text-shadow:0 0 26px var(--glow);min-width:1.9em}
  .tc-num.spin{color:var(--ink-dim);text-shadow:none;opacity:.75}
  .tc-num.landed{animation:pop .45s ease}
  .tc-stmt{font-family:'Hahmlet',serif;font-weight:500;font-size:clamp(18px,4vw,26px);line-height:1.55;min-height:2.2em;display:flex;align-items:center;justify-content:center;transition:opacity .4s ease}
  .tc-stmt.spin{color:var(--ink-dim);opacity:.75}
  .tc-stmt.landed{animation:pop .45s ease}
  .tc-hint{font-size:12.5px;color:var(--ink-dim);opacity:0;transition:opacity .4s ease}
  .tc-hint.show{opacity:1}

  .endwrap{display:flex;flex-direction:column;gap:16px;align-items:center;animation:pop .5s ease}
  .end-emoji{font-size:52px;line-height:1;filter:drop-shadow(0 6px 18px var(--glow))}
  .end-title{font-family:'Hahmlet',serif;font-weight:700;font-size:clamp(24px,5.5vw,34px)}
  .end-sub{font-size:14px;color:var(--ink-dim);line-height:1.7}

  .introwrap{display:flex;flex-direction:column;gap:18px;align-items:center;width:100%}
  .intro-guide{font-size:15px;line-height:1.85;color:var(--ink);max-width:460px}
  .intro-guide .hl{color:var(--accent);font-weight:600}
  .intro-note{font-size:11.5px;color:var(--ink-dim)}

  .dots{display:flex;gap:9px;justify-content:center;align-items:center;min-height:10px;margin:-6px 0 20px}
  .dots .d{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.16);transition:background .35s,box-shadow .35s,transform .35s}
  .dots .d.on{background:var(--accent);box-shadow:0 0 10px var(--glow)}
  .dots .d.now{transform:scale(1.4)}

  @keyframes pop{0%{opacity:0;transform:scale(.92)}100%{opacity:1;transform:scale(1)}}
  .next{font-family:inherit;font-size:16px;color:#141018;font-weight:bold;letter-spacing:.04em;background:var(--accent);border:none;border-radius:40px;
    padding:16px 40px;cursor:pointer;box-shadow:0 14px 34px -14px var(--glow);transition:transform .15s,filter .2s}
  .next:active{transform:scale(.95)}
  .next:hover{filter:brightness(1.06)}
  .ghost{font-family:inherit;font-size:14px;color:var(--ink);background:rgba(255,255,255,.06);border:1px solid var(--glow);border-radius:40px;padding:15px 28px;cursor:pointer;transition:.2s}
  .ghost:active{transform:scale(.95)}
  .ghost:hover{background:var(--accent-soft)}
  .pass{margin-top:16px;font-size:12px;color:var(--ink-dim)}
  .pass b{color:var(--accent);font-weight:normal}

  @media(max-height:660px){.qcard{min-height:160px;padding:26px 20px;margin:12px 0 14px}.theme-head{margin-bottom:6px}.rule{margin-top:10px}}
</style>
</head>
<body>
<div class="glow" id="glow"></div>
<span class="petal" style="left:12%;animation-duration:13s;animation-delay:0s">🫧</span>
<span class="petal" style="left:38%;animation-duration:17s;animation-delay:4s;font-size:15px">🫧</span>
<span class="petal" style="left:66%;animation-duration:15s;animation-delay:2s">🫧</span>
<span class="petal" style="left:86%;animation-duration:19s;animation-delay:7s;font-size:14px">🫧</span>

<div class="stage">

  <div id="home" class="screen show">
    <div class="brand">T I P S Y &nbsp;P A R T Y</div>
    <h1>오늘 밤 나눌 <b>이야기</b>를<br>골라 줘</h1>
    <p class="sub">쉼에서 시작해, 삶을 지나, 애까지.</p>
    <div class="cards" id="topCards"></div>
  </div>

  <div id="subsel" class="screen">
    <div class="brand">T I P S Y &nbsp;P A R T Y</div>
    <h1 id="subTitle"></h1>
    <p class="sub" id="subDesc"></p>
    <div class="cards" id="subCards"></div>
    <p class="pass" style="margin-top:26px"><button class="back" onclick="goHome()">← 큰 키워드 다시 고르기</button></p>
  </div>

  <div id="table">
    <div class="topbar">
      <button class="back" onclick="goSubs()">← 키워드 바꾸기</button>
      <div class="rounds" id="roundsBar">
        <button class="rd active" data-r="1" onclick="setRound(1)">1R 가볍게</button>
        <button class="rd" data-r="2" onclick="setRound(2)">2R</button>
        <button class="rd" data-r="3" onclick="setRound(3)">3R 깊게</button>
      </div>
    </div>
    <div class="theme-head">
      <div class="theme-kw" id="t-kw"></div>
      <div class="theme-name serif" id="t-name"></div>
      <div class="rule" id="t-rule"><b>질문 카드</b> 💬 돌아가면서 편하게 이야기해요</div>
    </div>
    <div class="qcard" id="qcard"><span class="qmark">"</span><div id="qbody"></div></div>
    <div class="dots" id="dots"></div>
    <button class="next" id="nextBtn" onclick="nextQ()" style="display:none">다음 →</button>
    <div class="pass" id="passNote" style="display:none">부담되면 <b>패스 OK</b> · 한 문장이면 충분해요</div>
  </div>

</div>

<script>
/* ---------- 데이터 ---------- */
const TOP = {
  rest:{kw:"쉼", desc:"잠깐 숨 고르며 나누는 이야기", tagline:"휴식 · 콘텐츠 · 취향 · 여행",
    accent:"#5B9CE8", glow:"rgba(91,156,232,.32)", soft:"rgba(91,156,232,.12)", subs:["relax","content","taste","travel"]},
  life:{kw:"삶", desc:"각자의 하루가 담긴 이야기", tagline:"가치관 · 일 · 미래 · 관계",
    accent:"#F5A24E", glow:"rgba(245,162,78,.34)", soft:"rgba(245,162,78,.12)", subs:["values","work","future","relation"]},
  love:{kw:"애", desc:"설렘과 사랑에 관한 이야기", tagline:"첫인상 · 호감 · 연애 · 사랑의 언어",
    accent:"#EE566B", glow:"rgba(238,86,107,.32)", soft:"rgba(238,86,107,.12)", subs:["first","spark","style","language"]},
};

const SUBS = {
  /* ── 쉼 ── */
  relax:{kw:"휴식", emoji:"😴", name:"아무것도 안 하는 날", top:"rest",
    q:{1:["쉬는 날 알람을 맞춰놓고 일어나? 아니면 알람 없이 자?","쉬는 날 하루 종일 집에 있어도 괜찮아?","쉬는 날 눈 뜨자마자 가장 먼저 하는 건 뭐야?","침대에서 하루 종일 있기 vs 밖에 나가기, 뭐가 더 좋아?","혼자 집에 있을 때 가장 많이 하는 건 뭐야?"],
       2:["최근에 하루를 쉬었는데 가장 만족스러웠던 날은 언제야?","스트레스를 받으면 가장 먼저 하는 행동은 뭐야?","쉬는 날에도 꼭 해야 하는 일이 있어?","혼자 쉬다가 심심해서 누군가에게 연락한 적 있어?","내일 하루 종일 쉬게 된다면 오전에 뭐 할 거야?"],
       3:["요즘 잠, 여행, 혼자 있는 시간 중 뭐가 가장 필요해?","하루 종일 쉬었는데도 피곤했던 적 있어? 그날 뭐 했어?","쉬는 날에도 \"이렇게 놀고 있어도 되나?\"라고 생각한 적 있어?","혼자 있을 때 가장 편안하다고 느끼는 순간은 언제야?","아무 말 없이 같이 있어도 편한 사람을 한 명 떠올린다면 어떤 사람이야?"]}},
  content:{kw:"콘텐츠", emoji:"🎬", name:"요즘 뭐 보고 살아?", top:"rest",
    q:{1:["요즘 유튜브에서 가장 자주 보는 콘텐츠는 뭐야?","넷플릭스에서 볼 거 고르는 데 10분 넘게 걸리는 편이야?","영화관에서 팝콘 먹는 편이야, 영화에 집중하는 편이야?","좋아하는 노래를 하루에 몇 번까지 반복해서 들어봤어?","최근에 본 콘텐츠 중 친구에게 바로 추천하고 싶은 건 뭐야?"],
       2:["최근 본 영화·드라마·예능 중 하나만 추천한다면 뭐야?","보다가 실제로 울었던 영화나 드라마가 있어?","지금 당장 다시 보고 싶은 작품 하나만 고르면 뭐야?","주인공보다 더 좋아했던 캐릭터가 있어? 누구야?","같이 영화를 볼 때 상대방이 리액션을 많이 하는 게 좋아, 조용히 보는 게 좋아?"],
       3:["기분이 안 좋을 때 일부러 찾아보는 콘텐츠가 있어?","보고 나서 며칠 동안 계속 생각났던 작품이 있어?","내가 좋아하는 콘텐츠를 상대방도 좋아하면 더 친해질 것 같아?","네 인생을 영화로 만든다면 첫 장면으로 어떤 순간을 보여주고 싶어?","지금 네 기분을 영화 제목 하나로 표현한다면 뭐야?"]}},
  taste:{kw:"취향", emoji:"🎵", name:"겹치는 플레이리스트", top:"rest",
    q:{1:["평생 한 음식만 먹어야 한다면 뭐를 고를 거야?","카페에 가면 거의 항상 주문하는 메뉴가 있어?","매운 음식 잘 먹어? 못 먹어?","맛집이라면 웨이팅 1시간까지 기다릴 수 있어?","옷을 살 때 디자인과 편안함 중 하나만 고른다면 뭐야?"],
       2:["주변 사람들은 싫어하는데 너는 좋아하는 음식이나 취향이 있어?","친구가 추천해서 좋아하게 된 음식이나 노래가 있어?","나와 취향이 완전히 다른 친구와도 친하게 지낼 수 있어?","친구가 추천한 음식이나 콘텐츠를 바로 해보는 편이야?","좋아하는 사람 때문에 음식·음악·패션 취향이 바뀐 적 있어?"],
       3:["친해질 때 음식·음악 같은 취향이 비슷하면 더 편해?","내가 좋아하는 걸 상대방이 싫어하면 설득해보는 편이야, 그냥 인정해주는 편이야?","처음 만난 사람의 취향 중 하나만 볼 수 있다면 뭘 보고 싶어?","나와 취향이 완전히 다른 사람에게 오히려 끌려본 적 있어?","\"이 사람 나랑 진짜 잘 맞는다\"라고 느꼈던 사람과 공통으로 좋아했던 건 뭐야?"]}},
  travel:{kw:"여행", emoji:"✈️", name:"떠나고 싶은 마음", top:"rest",
    q:{1:["여행 가기 전에 일정표를 만드는 편이야?","여행에서 숙소와 맛집 중 하나만 제대로 챙긴다면 뭐를 고를 거야?","여행 가면 사진을 많이 찍는 편이야?","바다에서 놀기 vs 산에서 걷기, 뭐가 좋아?","지금 바로 비행기를 탈 수 있다면 어디로 갈 거야?"],

function openSubs(k){
  curTop=k; const t=TOP[k];
  applyTheme(t);

  document.getElementById('subTitle').innerHTML=`<b>${t.kw}</b>의 결을<br>골라 줘`;
  document.getElementById('subDesc').textContent=t.desc;
  const box=document.getElementById('subCards'); box.innerHTML='';
  t.subs.forEach(sk=>{
    const s=SUBS[sk]; if(!s)return;
    const d=document.createElement('div');
    d.className='pick'; d.style.setProperty('--pk',t.accent);

}
function goHome(){ curTop=null; document.getElementById('glow').classList.remove('on'); show('home'); }
function goSubs(){ clearTcSpin(); cur=null; started=false; interRound=false; showChallenge=false; ended=false; openSubs(curTop); }

/* ---------- 화면: 테이블 ---------- */
function openTable(sk){
  clearTcSpin(); interRound=false; showChallenge=false; ended=false; requestWake();
  cur=sk; round=1; started=false;
  const s=SUBS[sk], t=TOP[s.top];
  applyTheme(t);
  document.getElementById('t-kw').textContent=`${t.kw} · ${s.kw}`;
  document.getElementById('t-name').textContent=s.name;
  document.getElementById('roundsBar').style.display='flex';
  document.getElementById('nextBtn').style.display='none';
  document.getElementById('passNote').style.display='none';
  document.getElementById('qcard').classList.add('start');
  document.querySelectorAll('.rd').forEach(b=>b.classList.toggle('active',b.dataset.r==='1'));
  document.getElementById('qbody').innerHTML=`<div class="introwrap">
    <div class="intro-guide">「${s.kw}」에 대한 <span class='hl'>질문 카드</span>가 한 장씩 떠 💬<br>돌아가면서 편하게 답해 줘.<br>정답은 없어, 솔직할수록 가까워져 🥂</div>
    <div class="intro-note">시작 전에 시계 방향으로 <b style="color:var(--accent)">1번~6번</b> 번호를 정해 줘 · 라운드가 끝나면 랜덤 3명에게 질문 & 미션이! 🎲</div>
    <button class="next" onclick="startTable()">시작하기 →</button></div>`;
  updateDots();
  show('table');
}
function startTable(){
  started=true; interRound=false; showChallenge=false; ended=false; clearTcSpin();
  tcDeck=shuffle([...TC_QUESTIONS.map(t=>({t:'q',s:t})),...TC_MISSIONS.map(t=>({t:'m',s:t}))]);
  document.getElementById('qcard').classList.remove('start');
  document.getElementById('passNote').style.display='block';
  buildQueue(); render(true);
}
function setRound(r){round=r;clearTcSpin();showChallenge=false;ended=false;document.querySelectorAll('.rd').forEach(b=>b.classList.toggle('active',+b.dataset.r===r));buildQueue();interRound=(started&&r>1&&!!ROUND_INTRO[r]);if(started)render(false);}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function buildQueue(){queue=shuffle([...SUBS[cur].q[round]]);qi=0;}

function cardHTML(){
  const item=queue[qi];
  if(ended){
    return `<div class="endwrap"><div class="end-emoji">🥂</div><div class="end-title">게임 종료</div><div class="end-sub">세 개의 라운드를 모두 지나왔어요.<br>오늘의 대화가 좋은 기억으로 남기를!</div><button class="next" onclick="goSubs()">다른 키워드 골라보기 →</button><button class="ghost" onclick="startTable()">이 키워드 한 번 더 ↺</button></div>`;
  }
  if(showChallenge){
    const lb = curItem&&curItem.t==='q' ? '💬 질문 타임' : '🎯 미션 타임';
    return `<div class="tcwrap"><div class="tc-label">${lb}</div><div class="tc-nums"><span class="tc-num spin">?</span><span class="tc-num spin">?</span><span class="tc-num spin">?</span></div><div class="tc-stmt" id="tcText" style="opacity:0"></div><div class="tc-hint show" id="tcHint">두구두구… 오늘의 주인공 세 명은? 🎲</div></div>`;
  }
  if(interRound){const ri=ROUND_INTRO[round]||{};
    return `<div class="rwrap"><div class="r-num">${round}R</div><div class="r-sub">${ri.sub||''}</div><div class="r-hint">${ri.hint||'준비되면 다음을 눌러줘'}</div></div>`;
  }
  return `<div class="taste"><div class="taste-stmt">${item}</div><div class="taste-hint">돌아가면서 편하게 이야기해 줘 💬</div></div>`;
}
function updateNextBtn(){
  const nb=document.getElementById('nextBtn'), pn=document.getElementById('passNote');
  if(!started||ended){nb.style.display='none';if(ended)pn.style.display='none';return;}
  if(tcSpinning){nb.style.display='none';pn.style.display='none';return;}
  nb.style.display='inline-block';
  nb.textContent = showChallenge ? (round<3?'다음 라운드 시작하기 →':'게임 마무리하기 →') : '다음 →';
  pn.style.display = showChallenge ? 'none' : 'block';
}
/* 챌린지 룰렛: 여러 미션이 빠르게 지나가다 점점 느려지며 착지 */
function clearTcSpin(){ if(tcSpin){clearTimeout(tcSpin);tcSpin=null;} tcSpinning=false; }
function startChallengeSpin(){
  const els=[...document.querySelectorAll('.tc-num')]; if(els.length!==3)return;
  clearTcSpin(); tcSpinning=true; updateNextBtn();
  let ticks=0, delay=70;
  const landAt=[10,15,20], landed=[false,false,false];
  const tick=()=>{
    const es=[...document.querySelectorAll('.tc-num')];
    if(es.length!==3){clearTcSpin();return;}
    ticks++;
    es.forEach((el,i)=>{
      if(landed[i])return;
      if(ticks>=landAt[i]){
        el.textContent=curNums[i]+'번';
        el.classList.remove('spin'); el.classList.add('landed');
        landed[i]=true;
      } else {
        el.textContent=(1+Math.floor(Math.random()*PLAYERS))+'번';
      }
    });
    if(landed.every(Boolean)){
      setTimeout(()=>{
        const t=document.getElementById('tcText');
        if(t&&curItem){t.textContent=curItem.s;t.style.opacity=1;t.classList.add('landed');}
        const h=document.getElementById('tcHint');
        if(h)h.textContent = curItem&&curItem.t==='q'
          ? '뽑힌 세 명이 솔직하게 답해 줘 · 있다/없다만 말해도 OK!'
          : '뽑힌 세 명이 미션 수행 · 부담되면 패스 OK!';
        tcSpinning=false; updateNextBtn();
      },450);
      return;
    }
    delay=Math.min(delay*1.09,220);
    tcSpin=setTimeout(tick,delay);
  };
  tick();
}
function updateDots(){
  const d=document.getElementById('dots'); if(!d)return;
  if(!started||interRound||showChallenge||ended||!queue.length){d.innerHTML='';return;}
  d.innerHTML=queue.map((_,i)=>`<span class="d${i<qi?' on':(i===qi?' on now':'')}"></span>`).join('');
}
function render(instant){const b=document.getElementById('qbody');
  if(instant){b.innerHTML=cardHTML();updateDots();updateNextBtn();return;}
  b.classList.add('fade');setTimeout(()=>{b.innerHTML=cardHTML();b.classList.remove('fade');updateDots();updateNextBtn();},380);}
function nextQ(){
  if(ended)return;
  if(interRound){interRound=false;render(false);return;}
  if(showChallenge){
    showChallenge=false;
    if(round<3){ setRound(round+1); }
    else { ended=true; render(false); }
    return;
  }
  if(qi<queue.length-1){ qi++; render(false); return; }
  /* 라운드의 마지막 질문 종료 → 질문/미션 타임 (3인 번호 룰렛 연출) */
  curNums = shuffle(Array.from({length:PLAYERS},(_,i)=>i+1)).slice(0,3).sort((a,b)=>a-b);
  if(!tcDeck.length) tcDeck=shuffle([...TC_QUESTIONS.map(t=>({t:'q',s:t})),...TC_MISSIONS.map(t=>({t:'m',s:t}))]);
  curItem = tcDeck.pop();
  showChallenge=true; render(false);
  setTimeout(startChallengeSpin, 430);
}

async function requestWake(){try{if('wakeLock' in navigator){wakeLock=await navigator.wakeLock.request('screen');}}catch(e){}}
document.addEventListener('visibilitychange',()=>{if(wakeLock!==null&&document.visibilityState==='visible')requestWake();});
</script>
